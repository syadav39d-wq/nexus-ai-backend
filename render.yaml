services:
  - type: web
    name: nexus-ai-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEXUS_API_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
